name: Docker Fullstack CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: false

      # 4️⃣ Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-springbootapp
          file: ./backend-springbootapp/backend.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/2300030326-exam-backend:final
            ${{ secrets.DOCKERHUB_USERNAME }}/2300030326-exam-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/2300030326-exam-backend:final
          cache-to: type=registry,mode=max,ref=${{ secrets.DOCKERHUB_USERNAME }}/2300030326-exam-backend:cache

      # 5️⃣ Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-reactapp
          file: ./frontend-reactapp/frontend.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/2300030326-exam-frontend:final
            ${{ secrets.DOCKERHUB_USERNAME }}/2300030326-exam-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/2300030326-exam-frontend:final
          cache-to: type=registry,mode=max,ref=${{ secrets.DOCKERHUB_USERNAME }}/2300030326-exam-frontend:cache
